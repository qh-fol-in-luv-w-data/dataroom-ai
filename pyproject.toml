[project]
name = "dataroom-ai-demo"
version = "0.1.0"
description = "Local demo of a permission-aware RAG core for an IPO data room (SharePoint/Entra simulated)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "numpy>=1.26,<2.3",
  "rank-bm25>=0.2.2",
  "unidecode>=1.3",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pypdfium2>=4.30",
  "pypdf>=5.0",
  "pillow>=10.4",
  "reportlab>=4.2",
  "paddlepaddle>=3.0",
  "paddleocr>=3.0",
  "torch>=2.4",
  "sentence-transformers>=3.0",
  "transformers>=4.44",
  "sentencepiece>=0.2",
  "protobuf>=4.25",
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs Ollama / heavy models", "e2e: end-to-end with LLM"]
